  </g><g transform="translate(560 198)">
    <rect width="360" height="64" rx="14" fill="#f3f4f6"/>
    <text x="120" y="43" text-anchor="end" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="700" fill="#0E7C6B">7/10</text>
