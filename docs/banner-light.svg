  <text x="40" y="164" font-size="20" fill="#0b0b0b">Lean YouTube ad blocker for Chrome and Firefox.</text>
  <text x="40" y="192" font-size="15" fill="#52514e">No ads before, during or after videos – and no waiting either.</text>
  <g transform="translate(40 218)"><rect width="86.8" height="30" rx="15" fill="#ffffff" stroke="#e6e5df"/><text x="43.4" y="20" text-anchor="middle" font-size="13" fill="#52514e">No popups</text></g><g transform="translate(136.8 218)"><rect width="187.6" height="30" rx="15" fill="#ffffff" stroke="#e6e5df"/><text x="93.8" y="20" text-anchor="middle" font-size="13" fill="#52514e">Rules update themselves</text></g><g transform="translate(334.4 218)"><rect width="101.2" height="30" rx="15" fill="#ffffff" stroke="#e6e5df"/><text x="50.6" y="20" text-anchor="middle" font-size="13" fill="#52514e">Manifest V3</text></g>
  <g transform="translate(560 46)">
