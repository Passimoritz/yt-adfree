<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="YT AdFree: lean YouTube ad blocker for Chrome and Firefox">
  <rect x="0.5" y="0.5" width="959" height="299" rx="20" fill="#fcfcfb" stroke="#e6e5df"/>

  <defs><radialGradient id="glow-light" cx="0.1" cy="0.05" r="0.9"><stop offset="0" stop-color="#0E7C6B" stop-opacity="0.1"/><stop offset="1" stop-color="#0E7C6B" stop-opacity="0"/></radialGradient></defs>
