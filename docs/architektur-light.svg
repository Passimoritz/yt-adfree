<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Aufbau von YT AdFree">
  <defs><marker id="a-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#898781"/></marker></defs>
  <rect width="880" height="420" rx="16" fill="#fcfcfb"/>
  <text x="32" y="44" font-size="20" font-weight="600" fill="#0b0b0b">So arbeitet YT AdFree</text>
  
  <g transform="translate(32 72)">
    <rect width="250" height="128" rx="12" fill="#f4f5f7" stroke="#c3c2b7" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="600" fill="#0b0b0b">uBlock-Origin-Listen</text>
    <text x="16" y="52" font-size="13" fill="#52514e" xml:space="preserve">filters.txt + Unterlisten</text><text x="16" y="72" font-size="13" fill="#52514e" xml:space="preserve">quick-fixes.txt</text><text x="16" y="92" font-size="13" fill="#52514e" xml:space="preserve">EasyList</text>
  </g>
  
  <g transform="translate(32 248)">
    <rect width="250" height="140" rx="12" fill="#f4f5f7" stroke="#c3c2b7" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="600" fill="#0b0b0b">background.js</text>
    <text x="16" y="52" font-size="13" fill="#52514e" xml:space="preserve">lädt alle 6 Stunden</text><text x="16" y="72" font-size="13" fill="#52514e" xml:space="preserve">zieht nur YouTube-Regeln</text><text x="16" y="92" font-size="13" fill="#52514e" xml:space="preserve">speichert sie lokal</text>
  </g>
  
  <g transform="translate(332 72)">
    <rect width="236" height="128" rx="12" fill="#f4f5f7" stroke="#c3c2b7" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="600" fill="#0b0b0b">rules.json</text>
    <text x="16" y="52" font-size="13" fill="#52514e" xml:space="preserve">sperrt Anzeigen-Server</text><text x="16" y="72" font-size="13" fill="#52514e" xml:space="preserve">(declarativeNetRequest)</text>
  </g>
  
  <g transform="translate(332 248)">
    <rect width="236" height="140" rx="12" fill="#f4f5f7" stroke="#c3c2b7" stroke-width="1"/>
    <text x="16" y="28" font-size="15" font-weight="600" fill="#0b0b0b">content.js</text>
    <text x="16" y="52" font-size="13" fill="#52514e" xml:space="preserve">blendet Werbeflächen aus</text><text x="16" y="72" font-size="13" fill="#52514e" xml:space="preserve">Reserve: Werbung stumm</text><text x="16" y="92" font-size="13" fill="#52514e" xml:space="preserve">mit 16× durchspulen</text>
  </g>
  
  <g transform="translate(618 72)">
    <rect width="230" height="316" rx="12" fill="#f4f5f7" stroke="#0E7C6B" stroke-width="2"/>
    <text x="16" y="28" font-size="15" font-weight="600" fill="#0b0b0b">content-main.js</text>
    <text x="16" y="52" font-size="13" fill="#52514e" xml:space="preserve">läuft in der YouTube-Seite</text><text x="16" y="72" font-size="13" fill="#52514e" xml:space="preserve"></text><text x="16" y="92" font-size="13" fill="#52514e" xml:space="preserve">1  Videoanfrage bekommt</text><text x="16" y="112" font-size="13" fill="#52514e" xml:space="preserve">    werbefreie Kennung</text><text x="16" y="132" font-size="13" fill="#52514e" xml:space="preserve">2  restliche Werbedaten</text><text x="16" y="152" font-size="13" fill="#52514e" xml:space="preserve">    werden entfernt</text><text x="16" y="172" font-size="13" fill="#52514e" xml:space="preserve">3  Strafzeitgeber verkürzt</text><text x="16" y="192" font-size="13" fill="#52514e" xml:space="preserve">4  bei Problemen: nächste</text><text x="16" y="212" font-size="13" fill="#52514e" xml:space="preserve">    Kennung</text>
  </g>
  <line x1="157" y1="200" x2="157" y2="244" stroke="#898781" stroke-width="2" marker-end="url(#a-light)"/><text x="166" y="228" font-size="12" fill="#898781">Regeln</text>
  <line x1="282" y1="318" x2="328" y2="318" stroke="#898781" stroke-width="2" marker-end="url(#a-light)"/>
  <line x1="568" y1="318" x2="614" y2="318" stroke="#898781" stroke-width="2" marker-end="url(#a-light)"/>
</svg>
