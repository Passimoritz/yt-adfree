<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Aufrufe mit Werbung: ohne Erweiterung 11 von 11, mit Erweiterung 0 von 17">
  <rect width="880" height="230" rx="16" fill="#1a1a19"/>
  <text x="32" y="44" font-size="20" font-weight="600" fill="#f0efec">Aufrufe mit Werbung</text>
  <text x="32" y="66" font-size="13" fill="#c3c2b7">Direktaufrufe und Weiterklicken in YouTube, Testläufe vom 18.11.2026</text>
  
  <g transform="translate(32 92)">
    <rect width="392" height="112" rx="12" fill="#24252b"/>
    <text x="24" y="32" font-size="14" fill="#c3c2b7">Ohne Erweiterung</text>
    <text x="24" y="74" font-size="40" font-weight="600" fill="#f0efec">11</text>
    <text x="80" y="74" font-size="14" fill="#c3c2b7">von 11 Aufrufen</text>
    <rect x="24" y="90" width="344" height="8" rx="4" fill="#2c2c2a"/>
    <rect x="24" y="90" width="344" height="8" rx="4" fill="#d95926"/>
  </g>
  
  <g transform="translate(456 92)">
    <rect width="392" height="112" rx="12" fill="#24252b"/>
    <text x="24" y="32" font-size="14" fill="#c3c2b7">Mit YT AdFree</text>
    <text x="24" y="74" font-size="40" font-weight="600" fill="#f0efec">0</text>
    <text x="58" y="74" font-size="14" fill="#c3c2b7">von 17 Aufrufen</text>
    <rect x="24" y="90" width="344" height="8" rx="4" fill="#2c2c2a"/>
    
  </g>
</svg>
